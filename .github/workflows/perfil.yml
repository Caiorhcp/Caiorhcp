# Gera os gráficos do perfil no próprio repositório (sem depender de serviços externos que caem).
# Requer o segredo PERFIL: token clássico com escopos repo e read:user, para contar repositórios privados.
name: Atualizar perfil

on:
  schedule:
    - cron: "17 9 * * *" # todo dia, 06:17 em Fortaleza
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/perfil.yml"]

permissions:
  contents: write

concurrency:
  group: perfil
  cancel-in-progress: true

jobs:
  graficos:
    runs-on: ubuntu-latest
    steps:
      - name: Métricas (contribuições e calendário)
        uses: lowlighter/metrics@v3.34
        continue-on-error: true # sem o segredo PERFIL esta etapa falha, mas a cobrinha ainda é gerada
        with:
          token: ${{ secrets.PERFIL }}
          user: Caiorhcp
          filename: assets/metricas.svg
          template: classic
          base: header, activity, community, repositories
          config_timezone: America/Fortaleza
          config_display: large
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          committer_message: "chore: atualizar métricas do perfil"

      # Linguagens pelos próprios commits (modo indepth), não pelo tamanho dos repositórios:
      # mede o que eu escrevo de fato, inclusive nos repositórios privados.
      - name: Linguagens mais usadas
        uses: lowlighter/metrics@v3.34
        continue-on-error: true
        with:
          token: ${{ secrets.PERFIL }}
          user: Caiorhcp
          filename: assets/linguagens.svg
          template: classic
          base: ""
          config_timezone: America/Fortaleza
          config_display: large
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_sections: most-used, recently-used
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          plugin_languages_threshold: 2%
          plugin_languages_other: yes
          committer_message: "chore: atualizar gráfico de linguagens"

      - uses: actions/checkout@v7

      - name: Cobrinha das contribuições
        uses: Platane/snk@v3.5.0
        with:
          github_user_name: Caiorhcp
          outputs: |
            assets/cobrinha-escura.svg?palette=github-dark&color_snake=#6fb3b3
            assets/cobrinha-clara.svg?palette=github-light&color_snake=#1f5f63

      - name: Salvar a cobrinha
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --quiet
          git add assets/cobrinha-*.svg
          git diff --cached --quiet || (git commit -m "chore: atualizar cobrinha das contribuições" && git push)
