<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="Caio Vinicius · Desenvolvedor Full Stack">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117" />
      <stop offset="0.55" stop-color="#0f2a2b" />
      <stop offset="1" stop-color="#123c3a" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3fb950" />
      <stop offset="1" stop-color="#6fb3b3" />
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#ffffff" stroke-opacity="0.04" />
    </pattern>
  </defs>

  <rect width="1200" height="260" rx="18" fill="url(#bg)" />
  <rect width="1200" height="260" rx="18" fill="url(#grid)" />

  <!-- colchetes de código, decorativos -->
  <text x="1110" y="175" font-family="Consolas, 'Courier New', monospace" font-size="140" fill="#6fb3b3" fill-opacity="0.12" text-anchor="end">&lt;/&gt;</text>

  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="64" y="104" font-size="54" font-weight="700" fill="#e6edf3">Caio Vinicius</text>
    <rect x="64" y="122" width="132" height="5" rx="2.5" fill="url(#accent)" />
    <text x="64" y="166" font-size="26" fill="#c9d1d9">Desenvolvedor Full Stack</text>
    <text x="64" y="206" font-family="Consolas, 'Courier New', monospace" font-size="19" fill="#6fb3b3">
      web · mobile · APIs · IA aplicada
    </text>
  </g>
</svg>
